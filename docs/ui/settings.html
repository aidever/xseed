<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="xseed.css">
</head>
<body>
<div class="app">
<nav class="nav" aria-label="主导航">
<a class="brand" href="overview.html"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#3D5AFE"/><circle cx="13.5" cy="17" r="6.5" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><circle cx="20.5" cy="17" r="6.5" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2.4"/></svg><span><b>xseed</b><small>辅种小助手</small></span></a>
<div class="nav-label">菜单</div>
<a class="item" href="overview.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span class="label">概览</span></a>
<a class="item" href="sites.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9S14.5 18.3 12 21M12 3C9.5 5.7 8.2 8.7 8.2 12s1.3 6.3 3.8 9"/></svg><span class="label">站点</span></a>
<a class="item" href="jobs.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span class="label">辅种记录</span><span class="count">3</span></a>
<a class="item" href="settings.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="label">设置</span></a>
<a class="item" href="privacy.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.6-3.3 8-8 9-4.7-1-8-4.4-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span class="label">隐私说明</span></a>
<div class="net"><div class="net-head"><span class="pulse"></span>辅种网络已连接</div><div class="net-row"><span>入口节点</span><span>hk-1 · 38 ms</span></div><div class="net-row"><span>已登记</span><span>3,214 个种子</span></div></div></nav>
<main class="main">
<header class="page-head">
<div class="title"><h1>设置</h1><p class="muted">默认值适合大多数人。</p></div>
<div class="actions"><button type="button" class="btn primary">保存更改</button></div>
</header>

<div class="grid" style="max-width:960px">
<section class="card span-12" aria-labelledby="dl-h">
<div class="card-head"><div><h2 id="dl-h">下载器</h2><p class="sub">小助手通过网页接口读取做种列表、加入新种子</p></div><button type="button" class="btn sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加</button></div>
<div class="feed-item" style="padding:0"><span class="logo-q">qB</span><div class="grow"><span class="name">qBittorrent 5.0.2</span><span class="meta mono">http://192.168.1.10:8080 · admin</span></div><span class="chip ok"><span class="d"></span>已连接</span><button type="button" class="btn sm">修改</button></div>
</section>

<section class="card span-12" aria-labelledby="auto-h">
<h2 id="auto-h">自动辅种</h2>
<label class="switch"><input type="checkbox" checked><span class="t"><b>帮别人找到辅种</b><span>别人有同样的文件、并证明是该站会员时，告诉他种子编号。关掉后你仍能为自己辅种，但能找到的会变少。</span></span></label>
<div class="fields-2">
<div class="field"><label for="add-limit">每站每天最多加种</label><input id="add-limit" type="number" value="50" min="1" max="500"><span class="hint">单个站点可在站点页另行设置</span></div>
<div class="field"><label for="ans-limit">每站每天最多答题</label><input id="ans-limit" type="number" value="30" min="1" max="200"><span class="hint">每答一题需要从站点下载一个种子文件</span></div>
</div>
</section>

<section class="card span-12" aria-labelledby="adv-h">
<h2 id="adv-h">高级</h2>
<div class="fields-2">
<div class="field"><label for="entry">入口节点</label><select id="entry"><option>自动选择（当前 hk-1，38 ms）</option><option>hk-1</option><option>sg-2</option><option>tokyo-1</option></select><span class="hint">消息都经它转发：它能看到你的 IP，看不到内容</span></div>
<div class="field"><label for="log">日志级别</label><select id="log"><option>普通</option><option>详细</option></select></div>
</div>
<label class="switch"><input type="checkbox" disabled><span class="t"><b>加种前抽查文件</b><span>需要先给小助手映射数据目录。默认不读硬盘，直接信任下载器的做种状态。</span></span></label>
</section>

<section class="card span-12" aria-labelledby="acc-h">
<div class="card-head"><div><h2 id="acc-h">管理员密码</h2><p class="sub">上次修改：11 月 8 日</p></div><button type="button" class="btn sm">修改密码</button></div>
</section>
</div>
</main>
</div>
</body>
</html>
