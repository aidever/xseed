<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置向导：下载器 · xseed</title>
<link rel="stylesheet" href="xseed.css">
</head>
<body>
<div class="wizard">
<div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#0F766E"/><path d="M8 9l12 10M20 9L8 19" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></svg><div><b>xseed</b><span>辅种小助手</span></div></div>
<div class="wizard-body">
<ol class="steps" aria-label="设置步骤">
<li class="done"><span class="n">✓</span>设置密码</li>
<li class="cur" aria-current="step"><span class="n">2</span>下载器</li>
<li class=""><span class="n">3</span>确认站点</li>
<li class=""><span class="n">4</span>试运行</li>
</ol>
<section class="card" aria-labelledby="h">
<div style="display:flex;flex-direction:column;gap:4px"><h1 id="h" style="font-size:22px">连接你的下载器</h1><p class="muted">小助手通过下载器的网页接口读取做种列表、加入新种子。不需要挂载你的数据目录。</p></div>
<div class="alert info"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg><p>在 192.168.1.10:8080 发现了 qBittorrent，已帮你填好地址。</p></div>
<fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px">
<legend style="font-weight:500;padding:0;margin-bottom:6px">下载器类型</legend>
<div class="seg"><label class="on"><input type="radio" name="kind" checked>qBittorrent</label><label><input type="radio" name="kind">Transmission</label></div>
</fieldset>
<div class="field"><label for="url">网页界面地址</label><input id="url" type="url" value="http://192.168.1.10:8080"><span class="hint">就是你在浏览器里打开 qBittorrent 网页界面时用的地址</span></div>
<div class="fields-2">
<div class="field"><label for="user">用户名</label><input id="user" type="text" value="admin"></div>
<div class="field"><label for="pass">密码</label><input id="pass" type="password" value="password"></div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
<button type="button" class="btn">测试连接</button>
<span class="badge ok"><span class="dot"></span>已连接 qBittorrent 5.0.2，发现 3,214 个做种中的种子</span>
</div>
</section>
<div class="wizard-foot"><a class="btn" href="#">上一步</a><a class="btn primary" href="setup-2-sites.html">下一步：确认站点</a></div>
</div>
</div>
</body>
</html>
