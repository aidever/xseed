<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>xseed 辅种记录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[data-theme]{--bg:#F4F4F0;--panel:#FFFFFF;--panel2:#ECECE7;--line:#E2E2DC;--line2:#CFCFC8;--ink:#0E0F11;--ink2:#4C5058;--ink3:#666A72;--dot:rgba(14,15,17,0.07);--ok:#127347;--warn:#8F5300;--warn-bg:#FBEFD9;--err:#B0261C;--err-bg:#FBE5E2;--info:#2153B3;--heat0:#E4E4DE;--acc-text:#4A6600;color-scheme:light}
[data-theme=dark]{--bg:#08090B;--panel:#111215;--panel2:#1A1B1F;--line:#212328;--line2:#2E3137;--ink:#EEEFF1;--ink2:#A9ADB6;--ink3:#868B95;--dot:rgba(255,255,255,0.05);--ok:#62D49B;--warn:#F2B657;--warn-bg:#2B200F;--err:#FF8076;--err-bg:#311513;--info:#8DB4FF;--heat0:#1B1D21;--acc-text:initial;color-scheme:dark}
@media (prefers-color-scheme: dark){[data-theme=auto]{--bg:#08090B;--panel:#111215;--panel2:#1A1B1F;--line:#212328;--line2:#2E3137;--ink:#EEEFF1;--ink2:#A9ADB6;--ink3:#868B95;--dot:rgba(255,255,255,0.05);--ok:#62D49B;--warn:#F2B657;--warn-bg:#2B200F;--err:#FF8076;--err-bg:#311513;--info:#8DB4FF;--heat0:#1B1D21;--acc-text:initial;color-scheme:dark}}
@keyframes xs-blink{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
a{color:var(--ink)}a:hover{color:var(--ink2)}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100vh; background-color: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; color: var(--ink); font-family: Inter, 'Noto Sans SC', system-ui, sans-serif; font-size: 14px; line-height: 1.55; display: flex; flex-wrap: wrap; align-items: stretch">

<aside style="flex: 1 1 220px; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 28px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="10" cy="13" r="7" fill="none" stroke="{{accent}}" stroke-width="2.4"></circle><circle cx="16" cy="13" r="7" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="2.4"></circle></svg>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; font-size: 17px; letter-spacing: -0.02em">xseed</span>
</a>
<nav aria-label="主导航" style="display: flex; flex-wrap: wrap; gap: 2px">
<a href="Main.dc.html" style="flex: 1 1 180px; display: flex; align-items: center; height: 40px; padding: 0 10px 0 26px; border-radius: 8px; text-decoration: none; color: var(--ink2)">概览</a>
<a href="Sites.dc.html" style="flex: 1 1 180px; display: flex; align-items: center; height: 40px; padding: 0 10px 0 26px; border-radius: 8px; text-decoration: none; color: var(--ink2)">站点</a>
<a href="Jobs.dc.html" aria-current="page" style="flex: 1 1 180px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; text-decoration: none; background: var(--panel2); font-weight: 600"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 2px; background: {{accent}}"></span>辅种记录</a>
<a href="Settings.dc.html" style="flex: 1 1 180px; display: flex; align-items: center; height: 40px; padding: 0 10px 0 26px; border-radius: 8px; text-decoration: none; color: var(--ink2)">设置</a>
<a href="Privacy.dc.html" style="flex: 1 1 180px; display: flex; align-items: center; height: 40px; padding: 0 10px 0 26px; border-radius: 8px; text-decoration: none; color: var(--ink2)">隐私说明</a>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; color: var(--ink3)">
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: var(--ok)"></span><span style="color: var(--ink2)">qBittorrent 5.0.2</span></div>
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: var(--ok)"></span><span style="color: var(--ink2)">节点 hk-1</span><span style="margin-left: auto; font-family: 'JetBrains Mono', ui-monospace, monospace">38 ms</span></div>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 64px">
<div style="max-width: 1040px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15">辅种记录</h1>
<p style="margin: 0; color: var(--ink2)">每一条都能看到走到了哪一步；卡住的会写明原因和下一步。</p>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div role="group" aria-label="按状态筛选" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--panel2); overflow-x: auto; max-width: 100%">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; opacity: 0.7">{{t.n}}</span></button>
</sc-for>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--ink3); flex-wrap: wrap">
<span>发现</span><span>›</span><span>答题</span><span>›</span><span>下载</span><span>›</span><span>校验</span><span>›</span><span>做种</span>
</div>
</div>

<section aria-label="记录列表" style="background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 4px 24px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="{{r.rowStyle}}">
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
<span style="{{r.noteStyle}}">{{r.note}}</span>
</div>
<div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line2); display: inline-flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; font-weight: 600">{{r.site}}</span>
<div role="img" aria-label="{{r.trackLabel}}" style="display: flex; align-items: center; gap: 0">
<sc-for list="{{r.track}}" as="d" hint-placeholder-count="5"><span style="{{d.line}}"></span><span style="{{d.dot}}"></span></sc-for>
</div>
</div>
<span style="{{r.statusStyle}}">{{r.status}}</span>
<span style="flex: 0 0 76px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--ink3)">{{r.time}}</span>
<div style="flex: 0 0 76px; display: flex; justify-content: flex-end">
<sc-if value="{{r.retry}}" hint-placeholder-val="{{ false }}">
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; color: var(--ink); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">重试</button>
</sc-if>
</div>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 40px 0; text-align: center; color: var(--ink3)">这个分类下暂时没有记录。</p>
</sc-if>
</section>

<section aria-labelledby="danger-h" style="border: 1px dashed var(--line2); border-radius: 18px; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px">
<div style="flex: 1 1 380px; min-width: 0"><h2 id="danger-h" style="margin: 0; font-size: 15px; font-weight: 600">想全部撤回？</h2><p style="margin: 2px 0 0; color: var(--ink2)">从下载器移除 xseed 加入的全部种子。文件不会被删除，原来的种子不受影响。</p></div>
<button type="button" style="height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--err); background: transparent; color: var(--err); font: inherit; font-weight: 600; cursor: pointer">全部移除…</button>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F169","options":["#C8F169","#7DE3F4","#FFB35C","#B8A3FF"]},"theme":{"editor":"enum","options":["dark","light","auto"],"default":"dark"},"$preview":{"width":1280,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C8F169';
    const theme = this.props.theme ?? 'dark';
    const STEP = ['发现', '答题', '下载', '校验', '做种'];
    // [name, note, bad, site, reached(0-5), failedAt(-1 none), status, time, cat]
    const data = [
      ['Ocean.Planet.S01.2160p.WEB-DL.DDP5.1.H.265', '48.2 GB · 原种子在站点 Z', false, 'Y', 5, -1, '做种中', '今天 14:02', 'seed'],
      ['City.Nights.Live.2018.FLAC', '1.9 GB · 校验完成，约 6 分钟后启动', false, 'Y', 4, -1, '排队启动', '今天 13:20', 'run'],
      ['Mountain.Light.2021.1080p.BluRay.x264', '12.8 GB · 原种子在站点 Y', false, 'Z', 5, -1, '做种中', '今天 13:47', 'seed'],
      ['Quiet.Harbor.2020.1080p.WEB-DL.AAC', '下载种子失败：站点 W 登录已失效。去 PT-depiler 重新登录该站。', true, 'W', 2, 2, '失败', '今天 12:55', 'fail'],
      ['Desert.Road.2017.2160p.UHD.BluRay.HEVC', '61.0 GB · 该站要求校验，已通过', false, 'V', 5, -1, '做种中', '今天 11:31', 'seed'],
      ['Old.Film.Collection.1950-1959.DVD9', '下载器找不到文件，已自动移除（文件未动）。原文件可能被移动或改名。', true, 'Z', 3, 3, '已移除', '昨天 22:10', 'fail']
    ];
    const tab = this.state.tab;
    const defs = [['all', '全部', '298'], ['seed', '做种中', '286'], ['run', '进行中', '3'], ['fail', '失败', '9']];
    const tabs = defs.map(([id, label, n]) => {
      const on = id === tab;
      return {
        label, n, on, pick: () => this.setState({ tab: id }),
        style: 'flex: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 8px; font: inherit; font-size: 13.5px; cursor: pointer; font-weight: ' + (on ? 600 : 500) + '; background: ' + (on ? 'var(--panel)' : 'transparent') + '; color: ' + (on ? 'var(--ink)' : 'var(--ink2)') + (on ? '; box-shadow: 0 1px 2px rgba(0,0,0,0.25)' : '')
      };
    });
    const rows = data.filter((d) => tab === 'all' || d[8] === tab).map(([name, note, bad, site, reached, failAt, status, time], i) => {
      const track = STEP.map((s, j) => {
        const done = j < reached && j !== failAt;
        const failed = j === failAt;
        const live = !bad && j === reached && reached < 5;
        const c = failed ? 'var(--err)' : done ? accent : 'var(--line2)';
        return {
          line: j === 0 ? 'display: none' : 'width: 12px; height: 2px; background: ' + (j <= reached && failAt < 0 || j < failAt ? accent : 'var(--line2)'),
          dot: 'flex: none; width: ' + (failed ? 10 : 8) + 'px; height: ' + (failed ? 10 : 8) + 'px; border-radius: 50%; box-sizing: border-box; ' + (done || failed ? 'background: ' + c : 'border: 1.5px solid ' + (live ? accent : 'var(--line2)')) + (live ? '; animation: xs-blink 1.2s ease-in-out infinite' : '')
        };
      });
      const sc = bad ? 'var(--err)' : status === '做种中' ? 'var(--ink2)' : 'var(--info)';
      return {
        name, note, site, status, time, track,
        trackLabel: bad ? '卡在「' + STEP[failAt] + '」这一步' : reached === 5 ? '五步全部完成' : '已完成到「' + STEP[reached - 1] + '」',
        retry: status === '失败',
        statusStyle: 'flex: 0 0 64px; font-size: 12.5px; font-weight: 500; color: ' + sc,
        noteStyle: 'font-size: 12.5px; color: ' + (bad ? 'var(--err)' : 'var(--ink3)'),
        rowStyle: 'display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding: 15px 0; border-top: ' + (i === 0 ? '0' : '1px solid var(--line)')
      };
    });
    return { accent, theme, tabs, rows, empty: rows.length === 0 };
  }
}
</script>
</body>
</html>
