<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <style>
      .h{font-size:17px;font-weight:700;fill:#0f172a}
      .b{font-size:14px;fill:#1e293b}
      .s{font-size:13px;fill:#334155}
      .t{font-size:11.5px;fill:#7c3aed;font-family:'JetBrains Mono','Consolas','WenQuanYi Zen Hei Mono',monospace}
      .g{font-size:12px;fill:#64748b}
      .n{font-size:12px;font-weight:700;fill:#fff}
    </style>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>

  <text x="640" y="44" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#0f172a">去中心化辅种 · 架构图（设计 2.0）</text>
  <text x="640" y="72" text-anchor="middle" class="g" style="font-size:14px">黑色大字：它在做什么　｜　<tspan fill="#7c3aed">紫色小字：用什么技术实现</tspan>　｜　蓝色圆圈：步骤顺序</text>

  <!-- 社区节点 -->
  <rect x="400" y="96" width="480" height="150" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="640" y="126" text-anchor="middle" class="h">社区节点（任何人都可以提供）</text>
  <text x="640" y="152" text-anchor="middle" class="b">登记簿：谁有“某个文件指纹”（只有匿名代号）</text>
  <text x="640" y="174" text-anchor="middle" class="b">传话筒：转发加密消息，双方互相看不到 IP</text>
  <text x="640" y="196" text-anchor="middle" class="t">Rust 节点 · HRW 分桶 · GitHub 签名清单 · 1c1g 可服务约 1 万台</text>
  <rect x="455" y="208" width="370" height="26" rx="13" fill="#e2e8f0"/>
  <text x="640" y="226" text-anchor="middle" class="g" style="fill:#475569">不知道站点、种子编号，也无法把 IP 和文件对上</text>

  <!-- 左：你的小助手 -->
  <rect x="40" y="290" width="370" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="225" y="320" text-anchor="middle" class="h">你的设备（NAS / 电脑）</text>
  <rect x="64" y="336" width="322" height="58" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="225" y="360" text-anchor="middle" class="b">qBittorrent / Transmission</text>
  <text x="225" y="380" text-anchor="middle" class="t">只通过下载器网页接口，不读硬盘</text>
  <text x="64" y="424" class="b" style="font-weight:600">辅种小助手</text>
  <text x="64" y="448" class="s">· 计算文件指纹（文件结构，不含根目录名）</text>
  <text x="78" y="466" class="t">SHA-256(每个文件的路径 + 大小)</text>
  <text x="64" y="492" class="s">· 账号、passkey、Cookie 只存在本机</text>
  <text x="78" y="510" class="t">本机加密保存，永不发送给任何人</text>
  <text x="64" y="536" class="s">· 新种子指向已有文件，不复制不移动</text>
  <text x="78" y="554" class="t">停止状态加入 → 确认 100% → 做种</text>
  <text x="64" y="580" class="s">· 带 xseed 标签，一键撤回（保留文件）</text>
  <text x="78" y="598" class="t">Cookie 可由 PT-depiler 经 WebDAV 同步</text>

  <!-- 右：对方小助手 -->
  <rect x="870" y="290" width="370" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1055" y="320" text-anchor="middle" class="h">对方设备（也有这份文件的人）</text>
  <rect x="894" y="336" width="322" height="58" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="1055" y="360" text-anchor="middle" class="b">qBittorrent / Transmission</text>
  <text x="1055" y="380" text-anchor="middle" class="t">他在 X 站做种这份文件</text>
  <text x="894" y="424" class="b" style="font-weight:600">辅种小助手</text>
  <text x="894" y="448" class="s">· 每个种子一个匿名代号，每周更换</text>
  <text x="908" y="466" class="t">AES 加密的代号 · 两跳登记</text>
  <text x="894" y="492" class="s">· 只回答答对会员题的人</text>
  <text x="908" y="510" class="t">题目是该站随机的近期种子</text>
  <text x="894" y="536" class="s">· 只说“X 站 #编号”，不发种子文件</text>
  <text x="908" y="554" class="t">不说名称、不说其他站</text>
  <text x="894" y="580" class="s">· 每站每天的答题、告知有上限</text>
  <text x="908" y="598" class="t">可随时关闭“帮别人找到辅种”</text>

  <!-- 1 登记 -->
  <path d="M1000,288 C1000,230 950,190 882,178" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ay)"/>
  <circle cx="1018" cy="236" r="11" fill="#2563eb"/><text x="1018" y="240.5" text-anchor="middle" class="n">1</text>
  <text x="1036" y="232" class="s">登记“我有指纹 F”</text>
  <text x="1036" y="249" class="t">经两个节点转发，单个节点无法关联 IP</text>

  <!-- 2 查询 -->
  <path d="M280,288 C280,230 330,190 398,178" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ay)"/>
  <circle cx="132" cy="236" r="11" fill="#2563eb"/><text x="132" y="240.5" text-anchor="middle" class="n">2</text>
  <text x="150" y="232" class="s">查询“谁也有 F”</text>
  <text x="150" y="249" class="t">得到若干匿名代号</text>

  <!-- 3 加密会话 -->
  <path d="M414,350 L866,350" fill="none" stroke="#2563eb" stroke-width="2.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <circle cx="640" cy="322" r="11" fill="#2563eb"/><text x="640" y="326.5" text-anchor="middle" class="n">3</text>
  <text x="640" y="376" text-anchor="middle" class="b">加密对话（全程经节点转发，不直连）</text>
  <text x="640" y="396" text-anchor="middle" class="t">Noise XXpsk3 · 密码由文件指纹算出 · 没有同款文件连不上</text>

  <!-- 4 答题 -->
  <rect x="440" y="420" width="400" height="120" rx="12" fill="#fefce8" stroke="#fde047"/>
  <circle cx="462" cy="444" r="11" fill="#2563eb"/><text x="462" y="448.5" text-anchor="middle" class="n">4</text>
  <text x="480" y="449" class="b" style="font-weight:600">会员答题</text>
  <text x="458" y="474" class="s">对方出题：“X 站 #12345 的 info_hash 是多少？”</text>
  <text x="458" y="496" class="s">你用自己的 X 站账号下载这个种子来作答</text>
  <text x="458" y="518" class="t">答案与本次会话绑定，转交给别人答无效</text>

  <!-- 5 告知 -->
  <path d="M866,580 L414,580" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <circle cx="640" cy="560" r="11" fill="#16a34a"/><text x="640" y="564.5" text-anchor="middle" class="n">5</text>
  <text x="640" y="604" text-anchor="middle" class="b">答对后只告诉你：“X 站 #67890”</text>
  <text x="640" y="622" text-anchor="middle" class="g">他不在 X 站，就回答“没有”——先答题后区分，不泄露他在哪些站</text>

  <!-- PT 站 -->
  <rect x="400" y="680" width="480" height="96" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="640" y="712" text-anchor="middle" class="h">PT 站点 X</text>
  <text x="640" y="738" text-anchor="middle" class="b">你只用自己的账号访问，和平时手动下载一样</text>
  <text x="640" y="760" text-anchor="middle" class="t">每站每分钟最多 2 次 · 每天最多加 50 个</text>

  <!-- 6 下载并加种 -->
  <path d="M225,622 C225,690 300,725 396,728" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <circle cx="225" cy="660" r="11" fill="#16a34a"/><text x="225" y="664.5" text-anchor="middle" class="n">6</text>
  <text x="70" y="700" class="s">用你的 passkey 下载 #67890</text>
  <text x="70" y="718" class="s">核对 info_hash 与文件结构一致</text>
  <text x="70" y="736" class="s">交给下载器，直接用已有文件做种</text>

  <!-- 站长 -->
  <text x="910" y="712" class="s">站长可在注册中心表态</text>
  <text x="910" y="730" class="s">“不允许”后，小助手立即停止该站</text>

  <!-- 底注 -->
  <text x="640" y="828" text-anchor="middle" class="g" style="font-size:13px">只辅种完全相同的内容：总大小与每个文件的路径、大小都一致（最外层文件夹名可以不同）</text>
  <text x="640" y="852" text-anchor="middle" class="g" style="font-size:13px">一次对话只问一个站；每次对话换新的回信代号，对方无法把多次询问关联到同一个人</text>
</svg>
