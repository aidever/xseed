name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings

  # Linux 静态二进制（musl），各架构在原生 runner 上编译
  linux:
    needs: test
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p xseed-agent -p xseed-node
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - run: mkdir -p dist && cp target/${{ matrix.target }}/release/xseed-agent target/${{ matrix.target }}/release/xseed-node dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/

  # Windows 托盘版小助手
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p xseed-agent -- -D warnings
      - run: cargo build --release --locked -p xseed-agent
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: target/release/xseed-agent.exe

  # 镜像只复制上面编译好的二进制，QEMU 仅用于 apk 安装证书，不再模拟编译
  image:
    needs: linux
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: dist/arm64
      - run: chmod +x dist/*/*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # 推送 v* 标签时发布 GitHub Release
  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: 打包
        run: |
          set -e
          v=${GITHUB_REF_NAME}
          mkdir out
          for a in amd64 arm64; do
            chmod +x art/linux-$a/*
            tar -C art/linux-$a -czf out/xseed-$v-linux-$a.tar.gz xseed-agent xseed-node
          done
          (cd art/windows-amd64 && zip -q ../../out/xseed-$v-windows-amd64.zip xseed-agent.exe)
          (cd out && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
