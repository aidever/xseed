[package]
name = "xseed-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xseed-core = { path = "../xseed-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rust-embed = "8"
mime_guess = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
url = "2"

[dev-dependencies]
tempfile = "3"
