[package]
name = "xseed-transport"
description = "xseed 社区节点协议：消息格式、两跳封装、代号、节点签名与客户端"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xseed-core = { path = "../xseed-core" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.15"
serde_json = "1"
ciborium = "0.2"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes = "0.8"
chacha20poly1305 = "0.10"
hpke = { version = "0.12", default-features = false, features = ["x25519", "alloc"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
subtle = "2"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
